name: Publish verified Free 0.1.1 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.1.1.yml'
      - 'release/0.1.1/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-free-0.1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the reviewed source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the exact locally tested package
        working-directory: release/0.1.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo 'The 0.1.1 release already exists; no assets were replaced.'
            exit 0
          fi
          gh release create v0.1.1 \
            release/0.1.1/seamwick_uv_free-0.1.1.zip \
            release/0.1.1/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Seamwick UV Free 0.1.1" \
            --notes-file release/0.1.1/NOTES.md \
            --latest
